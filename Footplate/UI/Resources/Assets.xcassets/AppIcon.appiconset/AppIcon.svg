<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
<!-- footplate's icon for iOS: footplate.svg without the 228 rounding, because iOS applies its own mask and the tile must be opaque to the edges. The Y is footplate-glyph-rust.svg as it stands. AppIcon.png is this file through rsvg-convert -w 1024: the tile is opaque, so the PNG has no alpha channel, and App Store Connect refuses one that has. -->
<rect width="1024" height="1024" fill="#161718"/>
<path d="M512 880 V600 C512 520 448 470 400 400 L235.4 160" fill="none" stroke="#D3602F" stroke-width="80"/>
<path d="M512 600 C512 520 576 470 624 400 L788.6 160" fill="none" stroke="#D3602F" stroke-width="80"/>
</svg>
